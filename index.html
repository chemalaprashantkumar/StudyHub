
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub - Online Learning</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f7fb;
  color: #222;
}

header {
  background: #2563eb;
  color: white;
  padding: 25px;
  text-align: center;
}

header h1 {
  font-size: 32px;
}

header p {
  margin-top: 8px;
}

nav {
  background: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;

iframe {

  height: 300px;
  border: none;
  border-radius: 10px;

</nav>

<div class="container">

</div>

<div class="card">
<h2>Learning Video</h2>
<br>

<iframe
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
